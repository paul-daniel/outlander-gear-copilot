<ng-container *transloco="let t">
<section class="max-w-7xl mx-auto px-6 sm:px-10 py-20">
  <div class="flex items-end justify-between mb-10">
    <div>
      <p class="text-[11px] uppercase tracking-[0.3em] text-outlander-500 dark:text-outlander-400 mb-3">{{ t('home.featuredSubtitle') }}</p>
      <h2 class="text-3xl sm:text-4xl font-light text-gray-900 dark:text-white">{{ t('home.featuredTitle') }}</h2>
    </div>
    <a routerLink="/products" class="hidden sm:inline-block text-[12px] uppercase tracking-[0.15em] text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white border-b border-gray-300 dark:border-gray-600 pb-0.5 transition-colors">
      {{ t('home.viewAll') }}
    </a>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-10">
    <div *ngFor="let product of products" class="flex flex-col group">
      <a [routerLink]="['/products', product.slug]" class="relative overflow-hidden bg-gray-100 dark:bg-gray-800 aspect-[3/4] mb-4">
        <img [src]="product.image_url" [alt]="product.name"
             class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-500" />
        <span *ngIf="product.compare_price"
              class="absolute top-3 left-3 text-[11px] uppercase tracking-wider text-red-600 bg-white dark:bg-gray-900 px-3 py-1">
          -{{ getDiscount(product) }}%
        </span>
        <!-- Quick add overlay -->
        <button
          (click)="addToCart.emit(product); $event.preventDefault()"
          [disabled]="product.stock_quantity === 0"
          class="absolute bottom-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 text-center py-3 text-[12px] uppercase tracking-[0.12em] translate-y-full group-hover:translate-y-0 transition-transform duration-300"
          [ngClass]="product.stock_quantity > 0
            ? 'text-gray-900 dark:text-white hover:bg-gray-900 hover:text-white dark:hover:bg-white dark:hover:text-gray-900'
            : 'text-gray-400 dark:text-gray-500 cursor-not-allowed'"
        >
          {{ product.stock_quantity > 0 ? t('products.addToCart') : t('products.outOfStock') }}
        </button>
      </a>
      <p class="text-[11px] uppercase tracking-[0.15em] text-gray-400 dark:text-gray-500 mb-1">{{ product.category_name }}</p>
      <a [routerLink]="['/products', product.slug]" class="text-[14px] text-gray-900 dark:text-white mb-1 hover:underline line-clamp-1">{{ product.name }}</a>
      <div class="flex items-center gap-2 mt-1">
        <span class="text-[14px] font-medium text-gray-900 dark:text-white">{{ product.price | number:'1.2-2' }} €</span>
        <span *ngIf="product.compare_price" class="text-[13px] text-gray-400 dark:text-gray-500 line-through">{{ product.compare_price | number:'1.2-2' }} €</span>
      </div>
    </div>
  </div>

  <div class="text-center mt-10 sm:hidden">
    <a routerLink="/products" class="text-[12px] uppercase tracking-[0.15em] text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white border-b border-gray-300 dark:border-gray-600 pb-0.5 transition-colors">
      {{ t('home.viewAll') }}
    </a>
  </div>
</section>
</ng-container>
