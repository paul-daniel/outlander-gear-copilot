<ng-container *transloco="let t">
<!-- Hero section -->
<app-home-hero></app-home-hero>

<!-- Value propositions -->
<section class="bg-outlander-950 text-white py-12">
  <div class="max-w-7xl mx-auto px-6 sm:px-10 grid grid-cols-1 sm:grid-cols-3 gap-8 text-center">
    <div class="flex flex-col items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-outlander-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
      </svg>
      <p class="text-[13px] tracking-wide font-medium">{{ t('home.freeShipping') }}</p>
      <p class="text-[12px] text-gray-400">{{ t('home.freeShippingDesc') }}</p>
    </div>
    <div class="flex flex-col items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-outlander-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
      <p class="text-[13px] tracking-wide font-medium">{{ t('home.warranty') }}</p>
      <p class="text-[12px] text-gray-400">{{ t('home.warrantyDesc') }}</p>
    </div>
    <div class="flex flex-col items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-outlander-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
      </svg>
      <p class="text-[13px] tracking-wide font-medium">{{ t('home.returns') }}</p>
      <p class="text-[12px] text-gray-400">{{ t('home.returnsDesc') }}</p>
    </div>
  </div>
</section>

<!-- Featured products -->
<app-home-featured
  [products]="featuredProducts"
  (addToCart)="onAddToCart($event)">
</app-home-featured>

<!-- Categories -->
<app-home-categories [categories]="categories"></app-home-categories>

<!-- Brand story CTA -->
<section class="relative overflow-hidden">
  <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1551632811-561732d1e306?w=1200')] bg-cover bg-center"></div>
  <div class="absolute inset-0 bg-outlander-950/60"></div>
  <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-10 py-24 sm:py-32 text-center">
    <h2 class="text-3xl sm:text-5xl font-light text-white mb-6 leading-tight">{{ t('home.brandTitle') }}</h2>
    <p class="text-[15px] text-white/70 max-w-2xl mx-auto leading-relaxed mb-10">{{ t('home.brandDescription') }}</p>
    <a routerLink="/products" class="inline-block text-[13px] uppercase tracking-[0.15em] text-white bg-outlander-700 hover:bg-outlander-800 px-8 py-3.5 transition-colors">
      {{ t('home.exploreGear') }}
    </a>
  </div>
</section>
</ng-container>
