<div class="mb-10">
  <h3 class="text-[11px] uppercase tracking-[0.25em] text-outlander-600 dark:text-outlander-400 mb-5 font-medium">{{ category.title }}</h3>
  <div class="divide-y divide-gray-100 dark:divide-gray-800 border-t border-b border-gray-100 dark:border-gray-800">
    <div *ngFor="let item of category.items; let i = index">
      <button
        (click)="toggle(i)"
        class="w-full flex items-center justify-between py-5 text-left group"
      >
        <span class="text-[14px] text-gray-900 dark:text-white pr-8 leading-relaxed group-hover:text-outlander-700 dark:group-hover:text-outlander-400 transition-colors">{{ item.question }}</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 text-gray-400 dark:text-gray-500 flex-shrink-0 transition-transform duration-200"
          [class.rotate-180]="openIndex === i"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>
      <div
        class="overflow-hidden transition-all duration-300"
        [style.max-height]="openIndex === i ? '500px' : '0px'"
        [style.opacity]="openIndex === i ? '1' : '0'"
      >
        <p class="text-[13px] text-gray-500 dark:text-gray-400 leading-relaxed pb-5 pr-10">{{ item.answer }}</p>
      </div>
    </div>
  </div>
</div>
