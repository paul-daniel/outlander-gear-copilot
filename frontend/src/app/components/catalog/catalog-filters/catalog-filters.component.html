<ng-container *transloco="let t">
<!-- Categories -->
<section class="mb-10 border-b border-gray-200 dark:border-gray-700 pb-6">
  <div class="flex flex-wrap items-center gap-6">
    <button
      (click)="categoryChange.emit('')"
      class="text-[12px] uppercase tracking-[0.15em] pb-1 transition-colors"
      [ngClass]="selectedCategory === '' ? 'text-gray-900 dark:text-white border-b border-gray-900 dark:border-white' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
    >
      {{ t('products.all') }}
    </button>
    <button
      *ngFor="let cat of categories"
      (click)="categoryChange.emit(cat.slug)"
      class="text-[12px] uppercase tracking-[0.15em] pb-1 transition-colors"
      [ngClass]="selectedCategory === cat.slug ? 'text-gray-900 dark:text-white border-b border-gray-900 dark:border-white' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
    >
      {{ cat.name }}
    </button>
  </div>
</section>

<!-- Search & Sort -->
<section class="flex flex-col sm:flex-row gap-4 mb-10 items-center">
  <div class="relative flex-grow w-full sm:w-auto">
    <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-300 dark:text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input
      type="text"
      [value]="searchQuery"
      (keyup)="onSearchKeyup($event, searchInput.value)"
      #searchInput
      [placeholder]="t('products.searchPlaceholder')"
      class="w-full pl-11 pr-4 py-3 border-b border-gray-200 dark:border-gray-700 focus:border-gray-900 dark:focus:border-white focus:outline-none text-[13px] bg-transparent text-gray-900 dark:text-gray-100 transition-colors"
    />
  </div>
  <select
    [ngModel]="sortBy"
    (ngModelChange)="sortChange.emit($event)"
    class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-transparent text-[13px] text-gray-600 dark:text-gray-400 focus:outline-none focus:border-gray-900 dark:focus:border-white transition-colors appearance-none cursor-pointer"
  >
    <option value="newest">{{ t('products.sortNewest') }}</option>
    <option value="price_asc">{{ t('products.sortPriceAsc') }}</option>
    <option value="price_desc">{{ t('products.sortPriceDesc') }}</option>
    <option value="name">{{ t('products.sortName') }}</option>
    <option value="rating">{{ t('products.sortRating') }}</option>
  </select>
  <span class="text-[12px] text-gray-400 dark:text-gray-500 tracking-wide">{{ totalCount > 1 ? t('products.productCountPlural', { count: totalCount }) : t('products.productCount', { count: totalCount }) }}</span>
</section>
</ng-container>
