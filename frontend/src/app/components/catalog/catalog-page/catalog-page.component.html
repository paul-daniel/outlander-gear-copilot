<ng-container *transloco="let t">
<div class="max-w-7xl mx-auto px-6 sm:px-10 py-10">
  <!-- Page header -->
  <div class="mb-10">
    <p class="text-[11px] uppercase tracking-[0.3em] text-outlander-500 dark:text-outlander-400 mb-3">{{ t('catalog.subtitle') }}</p>
    <h1 class="text-3xl sm:text-4xl font-light text-gray-900 dark:text-white">{{ t('catalog.title') }}</h1>
  </div>

  <!-- Filters -->
  <app-catalog-filters
    [categories]="categories"
    [selectedCategory]="selectedCategory"
    [searchQuery]="searchQuery"
    [sortBy]="sortBy"
    [totalCount]="pagination.total"
    (categoryChange)="onCategoryChange($event)"
    (searchChange)="onSearchChange($event)"
    (sortChange)="onSortChange($event)">
  </app-catalog-filters>

  <!-- Loader -->
  <div *ngIf="loading" class="flex justify-center items-center h-64">
    <div class="animate-spin rounded-full h-8 w-8 border-t border-b border-gray-900 dark:border-white"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="text-center text-red-600 py-10 text-[13px]">{{ error }}</div>

  <!-- Product grid -->
  <div *ngIf="!loading && !error" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-5 gap-y-12">
    <app-product-card
      *ngFor="let product of products"
      [product]="product"
      (addToCart)="onAddToCart($event)">
    </app-product-card>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && !error && products.length === 0" class="text-center py-24">
    <p class="text-[15px] text-gray-900 dark:text-white mb-2">{{ t('products.noProductsFound') }}</p>
    <p class="text-[13px] text-gray-400 dark:text-gray-500">{{ t('products.noProductsHint') }}</p>
  </div>

  <!-- Pagination -->
  <nav *ngIf="pagination.total_pages > 1" class="flex justify-center items-center gap-3 mt-16 mb-8">
    <button
      (click)="goToPage(pagination.page - 1)"
      [disabled]="pagination.page === 1"
      class="text-[12px] uppercase tracking-[0.1em] transition-colors px-3 py-2"
      [ngClass]="pagination.page === 1 ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
    >
      {{ t('products.previous') }}
    </button>
    <ng-container *ngFor="let p of [].constructor(pagination.total_pages); let i = index">
      <button
        (click)="goToPage(i + 1)"
        class="w-10 h-10 text-[13px] transition-colors"
        [ngClass]="pagination.page === i + 1 ? 'text-gray-900 dark:text-white border-b-2 border-gray-900 dark:border-white' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
      >
        {{ i + 1 }}
      </button>
    </ng-container>
    <button
      (click)="goToPage(pagination.page + 1)"
      [disabled]="pagination.page === pagination.total_pages"
      class="text-[12px] uppercase tracking-[0.1em] transition-colors px-3 py-2"
      [ngClass]="pagination.page === pagination.total_pages ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
    >
      {{ t('products.next') }}
    </button>
  </nav>
</div>
</ng-container>
